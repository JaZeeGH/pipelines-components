---
# Render ${KFP_WORKSPACE_PVC} with the workspace PVC created for the KFP run
# before applying this manifest, for example: envsubst < external-vllm.yaml | oc apply -f -.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-server
  namespace: efazal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-server
  template:
    metadata:
      labels:
        app: vllm-server
    spec:
      containers:
        - name: vllm
          image: registry.redhat.io/rhaii-early-access/vllm-cuda-rhel9@sha256:e95153e0bdce2b94d0470d4ac983d3c4b67576280afe99e97ce51700c57f3e5a
          command:
            - bash
            - -c
            - |
              pip install --extra-index-url https://pypi.org/simple git+https://github.com/vllm-project/speculators.git@fix-nfs-flock
              python -m vllm.entrypoints.cli.main serve /mnt/kfp-workspace/models/Qwen--Qwen3-0.6B \
                 --speculative-config '{"method":"extract_hidden_states","num_speculative_tokens":1,"draft_model_config":{"hf_config":{"eagle_aux_hidden_state_layer_ids":[2,14,25,28]}}}' \
                 --kv-transfer-config '{"kv_connector":"ExampleHiddenStatesConnector","kv_role":"kv_producer","kv_connector_extra_config":{"shared_storage_path":"/mnt/kfp-workspace/speculator-output/hidden_states"}}' \
                --port 8000 \
                --gpu-memory-utilization 0.9 \
                --no-enable-chunked-prefill
          ports:
            - containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: "1"
              memory: "64Gi"
              cpu: "8"
            requests:
              nvidia.com/gpu: "1"
              memory: "32Gi"
              cpu: "4"
          env:
            - name: HF_HOME
              value: /mnt/kfp-workspace/.cache/huggingface
            - name: HF_HUB_OFFLINE
              value: "0"
            - name: TRANSFORMERS_OFFLINE
              value: "0"
          volumeMounts:
            - name: kfp-workspace
              mountPath: /mnt/kfp-workspace
      volumes:
        - name: kfp-workspace
          persistentVolumeClaim:
            claimName: ${KFP_WORKSPACE_PVC}
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-svc
  namespace: efazal
spec:
  selector:
    app: vllm-server
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
