pipelineInfo:
  description: Extract Speculator hidden states using a managed vLLM sidecar.
  name: speculator-data-only-pipeline
root:
  dag:
    tasks:
      condition-branches-1:
        componentRef:
          name: comp-condition-branches-1
        dependentTasks:
        - download-model
        inputs:
          parameters:
            pipelinechannel--data_extraction_concurrency:
              componentInputParameter: data_extraction_concurrency
            pipelinechannel--data_extraction_max_samples:
              componentInputParameter: data_extraction_max_samples
            pipelinechannel--data_extraction_regenerate_responses:
              componentInputParameter: data_extraction_regenerate_responses
            pipelinechannel--dataset_name:
              componentInputParameter: dataset_name
            pipelinechannel--download_model:
              componentInputParameter: download_model
            pipelinechannel--enable_progression_tracking:
              componentInputParameter: enable_progression_tracking
            pipelinechannel--hidden_states_path:
              componentInputParameter: hidden_states_path
            pipelinechannel--metrics_poll_interval_seconds:
              componentInputParameter: metrics_poll_interval_seconds
            pipelinechannel--metrics_port:
              componentInputParameter: metrics_port
            pipelinechannel--output_dir:
              componentInputParameter: output_dir
            pipelinechannel--packages_to_install:
              componentInputParameter: packages_to_install
            pipelinechannel--persistent_pvc:
              componentInputParameter: persistent_pvc
            pipelinechannel--pip_index_urls:
              componentInputParameter: pip_index_urls
            pipelinechannel--speculator_type:
              componentInputParameter: speculator_type
            pipelinechannel--target_layer_ids:
              componentInputParameter: target_layer_ids
            pipelinechannel--total_seq_len:
              componentInputParameter: total_seq_len
            pipelinechannel--training_envs:
              componentInputParameter: training_envs
            pipelinechannel--training_runtime:
              componentInputParameter: training_runtime
            pipelinechannel--verifier_model:
              componentInputParameter: verifier_model
            pipelinechannel--verifier_model_pvc:
              componentInputParameter: verifier_model_pvc
            pipelinechannel--vllm_endpoint:
              componentInputParameter: vllm_endpoint
            pipelinechannel--vllm_gpu_memory_utilization:
              componentInputParameter: vllm_gpu_memory_utilization
            pipelinechannel--vllm_readiness_timeout_minutes:
              componentInputParameter: vllm_readiness_timeout_minutes
            pipelinechannel--vllm_resource_gpu:
              componentInputParameter: vllm_resource_gpu
            pipelinechannel--vllm_resource_memory:
              componentInputParameter: vllm_resource_memory
            pipelinechannel--vllm_source:
              componentInputParameter: vllm_source
        taskInfo:
          name: condition-branches-1
      download-model:
        cachingOptions: {}
        componentRef:
          name: comp-download-model
        inputs:
          parameters:
            download_enabled:
              componentInputParameter: download_model
            model_cache_mount:
              runtimeValue:
                constant: /mnt/persistent/models
            model_cache_pvc:
              componentInputParameter: persistent_pvc
            model_name:
              componentInputParameter: verifier_model
        taskInfo:
          name: download-model
  inputDefinitions:
    parameters:
      data_extraction_concurrency:
        defaultValue: 1.0
        description: Concurrent requests; use ``1`` on shared/NFS PVCs.
        isOptional: true
        parameterType: NUMBER_INTEGER
      data_extraction_max_samples:
        defaultValue: 16.0
        description: Samples to process; zero means all.
        isOptional: true
        parameterType: NUMBER_INTEGER
      data_extraction_regenerate_responses:
        defaultValue: false
        description: Regenerate built-in dataset responses with the verifier.
        isOptional: true
        parameterType: BOOLEAN
      dataset_name:
        defaultValue: ultrachat
        description: 'Built-in/Hugging Face dataset reference, local JSON/JSONL path

          such as ``datasets/train.jsonl``, or ``pvc://<claim>/datasets/train.jsonl``.'
        isOptional: true
        parameterType: STRING
      download_model:
        defaultValue: false
        description: 'Download ``verifier_model`` to the PVC when True; otherwise

          use the cached ``verifier_model_pvc`` path in managed mode.'
        isOptional: true
        parameterType: BOOLEAN
      enable_progression_tracking:
        defaultValue: true
        description: Enable progress reporting.
        isOptional: true
        parameterType: BOOLEAN
      hidden_states_path:
        defaultValue: speculator-output/hidden_states
        description: 'Hidden-state path such as

          ``speculator-output/hidden_states`` or

          ``pvc://<claim>/speculator-output/hidden_states``. External vLLM must be

          able to access the same path.'
        isOptional: true
        parameterType: STRING
      metrics_poll_interval_seconds:
        defaultValue: 30.0
        description: Progress polling interval.
        isOptional: true
        parameterType: NUMBER_INTEGER
      metrics_port:
        defaultValue: 28080.0
        description: Progress metrics port.
        isOptional: true
        parameterType: NUMBER_INTEGER
      output_dir:
        defaultValue: speculator-output
        description: 'Output directory such as ``speculator-output`` or

          ``pvc://<claim>/speculator-output``.'
        isOptional: true
        parameterType: STRING
      packages_to_install:
        defaultValue: ''
        description: Comma-separated TrainJob packages.
        isOptional: true
        parameterType: STRING
      persistent_pvc:
        description: RWX PVC backing relative model, output, dataset, and hidden-state
          paths.
        parameterType: STRING
      pip_index_urls:
        defaultValue: ''
        description: Comma-separated TrainJob package indexes.
        isOptional: true
        parameterType: STRING
      speculator_type:
        defaultValue: eagle3
        description: Draft type; currently ``eagle3``.
        isOptional: true
        parameterType: STRING
      target_layer_ids:
        defaultValue: ''
        description: Four layer IDs for a PVC verifier; empty enables SDK auto-selection
          for HF models.
        isOptional: true
        parameterType: STRING
      total_seq_len:
        defaultValue: 2048.0
        description: Maximum preprocessing and extraction sequence length.
        isOptional: true
        parameterType: NUMBER_INTEGER
      training_envs:
        defaultValue: NCCL_DEBUG=INFO,PYTHONUNBUFFERED=1
        description: Comma-separated TrainJob environment overrides.
        isOptional: true
        parameterType: STRING
      training_runtime:
        defaultValue: vllm-extract-cuda
        description: ClusterTrainingRuntime for extraction.
        isOptional: true
        parameterType: STRING
      verifier_model:
        defaultValue: ''
        description: Hugging Face verifier ID to download; leave empty to reuse the
          PVC model.
        isOptional: true
        parameterType: STRING
      verifier_model_pvc:
        defaultValue: models/Qwen--Qwen2.5-1.5B-Instruct
        description: 'Verifier path such as ``models/Qwen--Qwen2.5-1.5B-Instruct``

          or ``pvc://<claim>/models/Qwen--Qwen2.5-1.5B-Instruct``.'
        isOptional: true
        parameterType: STRING
      vllm_endpoint:
        defaultValue: ''
        description: External vLLM URL; required when source is ``remote``.
        isOptional: true
        parameterType: STRING
      vllm_gpu_memory_utilization:
        defaultValue: 0.9
        description: vLLM GPU memory fraction.
        isOptional: true
        parameterType: NUMBER_DOUBLE
      vllm_readiness_timeout_minutes:
        defaultValue: 60.0
        description: vLLM startup timeout.
        isOptional: true
        parameterType: NUMBER_INTEGER
      vllm_resource_gpu:
        defaultValue: 1.0
        description: GPUs for managed vLLM.
        isOptional: true
        parameterType: NUMBER_INTEGER
      vllm_resource_memory:
        defaultValue: 96Gi
        description: Memory for managed vLLM.
        isOptional: true
        parameterType: STRING
      vllm_source:
        defaultValue: managed
        description: Choose ``managed`` sidecar or ``remote`` external vLLM.
        isOptional: true
        parameterType: STRING
schemaVersion: 2.1.0
sdkVersion: kfp-2.16.1
---
platforms:
  kubernetes:
    deploymentSpec:
      executors:
        exec-download-model:
          pvcMount:
          - componentInputParameter: persistent_pvc
            mountPath: /mnt/persistent
            pvcNameParameter:
              componentInputParameter: persistent_pvc
          secretAsEnv:
          - keyToEnv:
            - envVar: HF_TOKEN
              secretKey: HF_TOKEN
            optional: true
            secretName: hf-token
            secretNameParameter:
              runtimeValue:
                constant: hf-token
        exec-extract-speculator:
          imagePullPolicy: IfNotPresent
          pvcMount:
          - componentInputParameter: pipelinechannel--persistent_pvc
            mountPath: /mnt/persistent
            pvcNameParameter:
              componentInputParameter: pipelinechannel--persistent_pvc
          secretAsEnv:
          - keyToEnv:
            - envVar: KUBERNETES_SERVER_URL
              secretKey: KUBERNETES_SERVER_URL
            - envVar: KUBERNETES_AUTH_TOKEN
              secretKey: KUBERNETES_AUTH_TOKEN
            optional: false
            secretName: kubernetes-credentials
            secretNameParameter:
              runtimeValue:
                constant: kubernetes-credentials
          - keyToEnv:
            - envVar: HF_TOKEN
              secretKey: HF_TOKEN
            optional: true
            secretName: hf-token
            secretNameParameter:
              runtimeValue:
                constant: hf-token
        exec-extract-speculator-2:
          imagePullPolicy: IfNotPresent
          pvcMount:
          - componentInputParameter: pipelinechannel--persistent_pvc
            mountPath: /mnt/persistent
            pvcNameParameter:
              componentInputParameter: pipelinechannel--persistent_pvc
          secretAsEnv:
          - keyToEnv:
            - envVar: KUBERNETES_SERVER_URL
              secretKey: KUBERNETES_SERVER_URL
            - envVar: KUBERNETES_AUTH_TOKEN
              secretKey: KUBERNETES_AUTH_TOKEN
            optional: false
            secretName: kubernetes-credentials
            secretNameParameter:
              runtimeValue:
                constant: kubernetes-credentials
          - keyToEnv:
            - envVar: HF_TOKEN
              secretKey: HF_TOKEN
            optional: true
            secretName: hf-token
            secretNameParameter:
              runtimeValue:
                constant: hf-token
    pipelineConfig:
      workspace:
        kubernetes:
          pvcSpecPatch:
            accessModes:
            - ReadWriteMany
            storageClassName: nfs-csi
        size: 200Gi
