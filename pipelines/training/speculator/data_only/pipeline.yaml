  comp-download-model:
    executorLabel: exec-download-model
    inputDefinitions:
      parameters:
        download_enabled:
          defaultValue: true
          description: If False, return the expected model directory without downloading.
          isOptional: true
          parameterType: BOOLEAN
        model_cache_mount:
          defaultValue: /mnt/models
          description: Mount path for the model cache PVC.
          isOptional: true
          parameterType: STRING
        model_cache_pvc:
          description: Name of the PVC to store models (unused here, mounted via pipeline).
          parameterType: STRING
        model_name:
          description: HuggingFace model ID (e.g. 'mistralai/Mistral-7B-Instruct-v0.3').
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
  comp-extract-speculator:
    executorLabel: exec-extract-speculator
    inputDefinitions:
      parameters:
        data_extraction_concurrency:
          defaultValue: 4.0
          description: Number of concurrent vLLM requests for hidden-state extraction.
          isOptional: true
          parameterType: NUMBER_INTEGER
        data_extraction_max_samples:
          description: Number of samples to process; zero or None means all.
          isOptional: true
          parameterType: NUMBER_INTEGER
        data_extraction_regenerate_responses:
          defaultValue: false
          description: 'Regenerate responses for ``magpie``,

            ``ultrachat``, or ``gsm8k`` with the verifier.'
          isOptional: true
          parameterType: BOOLEAN
        dataset_download_enabled:
          defaultValue: false
          description: Use the downloaded dataset URI instead of ``dataset_name``.
          isOptional: true
          parameterType: BOOLEAN
        dataset_name:
          description: '``magpie``, ``ultrachat``, ``gsm8k``, local JSON/JSONL path,
            or Trainer PVC URI.'
          parameterType: STRING
        download_model:
          defaultValue: false
          description: Download the verifier model to the shared PVC before extraction.
          isOptional: true
          parameterType: BOOLEAN
        downloaded_dataset_uri:
          description: URI emitted by the dataset download step when enabled.
          isOptional: true
          parameterType: STRING
        enable_progression_tracking:
          defaultValue: true
          description: Enable progress reporting.
          isOptional: true
          parameterType: BOOLEAN
        hidden_states_path:
          description: Hidden-state directory as a relative PVC path or explicit PVC
            URI.
          isOptional: true
          parameterType: STRING
        kubernetes_config:
          description: KFP task Kubernetes configuration passed through to Trainer.
          isOptional: true
          parameterType: TASK_CONFIG
        metrics_poll_interval_seconds:
          defaultValue: 30.0
          description: Seconds between metrics polls; valid range is ``5``-``300``.
          isOptional: true
          parameterType: NUMBER_INTEGER
        metrics_port:
          defaultValue: 28080.0
          description: HTTP port for extraction metrics; valid range is ``1024``-``65535``.
          isOptional: true
          parameterType: NUMBER_INTEGER
        output_dir:
          description: Output directory as a relative PVC path or an explicit ``pvc://<claim>/<path>``
            URI.
          parameterType: STRING
        packages_to_install:
          description: Comma-separated packages for the Trainer job.
          isOptional: true
          parameterType: STRING
        persistent_mount_path:
          defaultValue: /mnt/persistent
          description: Local mount path corresponding to ``persistent_pvc``.
          isOptional: true
          parameterType: STRING
        persistent_pvc:
          defaultValue: ''
          description: Name of the shared PVC mounted at ``persistent_mount_path``.
          isOptional: true
          parameterType: STRING
        pip_index_urls:
          description: Comma-separated package indexes for the Trainer job.
          isOptional: true
          parameterType: STRING
        pvc_path:
          description: KFP workspace mount path used to resolve the workspace PVC.
          parameterType: STRING
        speculator_type:
          defaultValue: eagle3
          description: Draft architecture; ``eagle3`` is currently the only supported
            type.
          isOptional: true
          parameterType: STRING
        target_layer_ids:
          description: 'Exactly four comma-separated verifier layer IDs; required

            for PVC-backed models and external vLLM.'
          isOptional: true
          parameterType: STRING
        total_seq_len:
          defaultValue: 2048.0
          description: Maximum sequence length for dataset preprocessing and vLLM
            extraction; must be positive.
          isOptional: true
          parameterType: NUMBER_INTEGER
        training_envs:
          defaultValue: ''
          description: Comma-separated environment overrides for the Trainer job.
          isOptional: true
          parameterType: STRING
        training_runtime:
          defaultValue: speculator-model-opt-cuda
          description: ClusterTrainingRuntime used for extraction.
          isOptional: true
          parameterType: STRING
        verifier_model:
          description: Hugging Face verifier ID to download, or the verifier path
            used by the runtime.
          parameterType: STRING
        verifier_model_pvc:
          description: Cached verifier path as a relative PVC path or explicit PVC
            URI.
          isOptional: true
          parameterType: STRING
        vllm_endpoint:
          description: Required remote vLLM URL; unset for managed mode.
          isOptional: true
          parameterType: STRING
        vllm_gpu_memory_utilization:
          defaultValue: 0.9
          description: Fraction of GPU memory available to vLLM, in the range ``(0,
            1]``.
          isOptional: true
          parameterType: NUMBER_DOUBLE
        vllm_readiness_timeout_minutes:
          defaultValue: 60.0
          description: 'Maximum wait for the managed or remote vLLM

            endpoint to become ready, in minutes.'
          isOptional: true
          parameterType: NUMBER_INTEGER
        vllm_resource_gpu:
          defaultValue: 1.0
          description: GPUs requested by managed vLLM; the SDK supports exactly one.
          isOptional: true
          parameterType: NUMBER_INTEGER
        vllm_resource_memory:
          defaultValue: 96Gi
          description: Memory requested by managed vLLM.
          isOptional: true
          parameterType: STRING
        vllm_source:
          defaultValue: managed
          description: '``managed`` for the in-job sidecar or ``remote`` for an external
            vLLM service.'
          isOptional: true
          parameterType: STRING
    outputDefinitions:
      artifacts:
        output_hidden_states:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
      parameters:
        Output:
          parameterType: STRING
    taskConfigPassthroughs:
    - field: RESOURCES
    - field: KUBERNETES_TOLERATIONS
    - field: KUBERNETES_NODE_SELECTOR
    - field: KUBERNETES_AFFINITY
    - applyToTask: true
      field: ENV
    - applyToTask: true
      field: KUBERNETES_VOLUMES
  comp-extract-speculator-2:
    executorLabel: exec-extract-speculator-2
    inputDefinitions:
      parameters:
        data_extraction_concurrency:
          defaultValue: 4.0
          description: Number of concurrent vLLM requests for hidden-state extraction.
