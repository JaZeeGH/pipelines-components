          \        Supported built-in names are ``magpie`` (Magpie-Align/Magpie-Llama-3.1-Pro-300K-Filtered),\n\
          \        ``ultrachat`` (HuggingFaceH4/ultrachat_200k), and ``gsm8k`` (openai/gsm8k).\n\
          \        For custom data, use a local JSON/JSONL file under ``persistent_mount_path``;\n\
          \        relative and absolute paths are converted to a Trainer PVC URI.\
          \ Existing\n        ``pvc://<claim>/<path>`` values keep their Trainer URI\
          \ semantics. Arbitrary\n        Hugging Face dataset IDs are not supported.\
          \ When ``dataset_download_enabled``\n        is true, ``downloaded_dataset_uri``\
          \ is used.\n        If response regeneration is enabled, responses are generated\
          \ with the verifier.\n\n    vLLM mode:\n        ``vllm_source=\"managed\"\
          `` uses an in-job sidecar. If ``download_model`` is\n        false and ``verifier_model_pvc``\
          \ is set, the cached model path is used.\n        Managed mode requires\
          \ ``vllm_endpoint`` to be unset or blank.\n        ``vllm_source=\"remote\"\
          `` requires a non-empty ``vllm_endpoint`` and\n        PVC-backed verifier\
          \ and hidden-state paths accessible to the external\n        server. A missing\
          \ remote endpoint raises an error; it never falls back to\n        the managed\
          \ sidecar. PVC-backed verifier models require exactly four\n        ``target_layer_ids``;\
          \ remote vLLM also requires them.\n\n    PVC paths:\n        ``verifier_model_pvc``,\
          \ ``output_dir``, and ``hidden_states_path`` accept\n        relative paths\
          \ or explicit ``pvc://<claim>/<path>`` Trainer URIs. Relative\n        paths\
          \ resolve against ``persistent_pvc`` when set, or the KFP workspace PVC\n\
          \        otherwise.\n\n    For example, with ``persistent_pvc=\"shared\"\
          ``, the relative\n    ``verifier_model_pvc=\"models/verifier\"`` is equivalent\
          \ to\n    ``pvc://shared/models/verifier``. The same applies to\n    ``output_dir=\"\
          speculator-output\"`` and\n    ``hidden_states_path=\"speculator-output/hidden_states\"\
          ``.\n\n    Args:\n        verifier_model: Hugging Face verifier ID to download,\
          \ or the verifier path used by the runtime.\n        output_dir: Output\
          \ directory as a relative PVC path or an explicit ``pvc://<claim>/<path>``\
          \ URI.\n        pvc_path: KFP workspace mount path used to resolve the workspace\
          \ PVC.\n        dataset_name: ``magpie``, ``ultrachat``, ``gsm8k``, local\
          \ JSON/JSONL path, or Trainer PVC URI.\n        verifier_model_pvc: Cached\
          \ verifier path as a relative PVC path or explicit PVC URI.\n        vllm_source:\
          \ ``managed`` for the in-job sidecar or ``remote`` for an external vLLM\
          \ service.\n        dataset_download_enabled: Use the downloaded dataset\
          \ URI instead of ``dataset_name``.\n        downloaded_dataset_uri: URI\
          \ emitted by the dataset download step when enabled.\n        hidden_states_path:\
          \ Hidden-state directory as a relative PVC path or explicit PVC URI.\n \
          \       vllm_endpoint: Required remote vLLM URL; unset for managed mode.\n\
          \        total_seq_len: Maximum sequence length for dataset preprocessing\
          \ and vLLM extraction; must be positive.\n        speculator_type: Draft\
          \ architecture; ``eagle3`` is currently the only supported type.\n     \
          \   target_layer_ids: Exactly four comma-separated verifier layer IDs; required\n\
          \            for PVC-backed models and external vLLM.\n        data_extraction_max_samples:\
          \ Number of samples to process; zero or None means all.\n        data_extraction_regenerate_responses:\
          \ Regenerate responses for ``magpie``,\n            ``ultrachat``, or ``gsm8k``\
          \ with the verifier.\n        data_extraction_concurrency: Number of concurrent\
          \ vLLM requests for hidden-state extraction.\n        vllm_resource_gpu:\
          \ GPUs requested by managed vLLM; the SDK supports exactly one.\n      \
          \  vllm_resource_memory: Memory requested by managed vLLM.\n        vllm_gpu_memory_utilization:\
          \ Fraction of GPU memory available to vLLM, in the range ``(0, 1]``.\n \
          \       vllm_readiness_timeout_minutes: Maximum wait for the managed or\
          \ remote vLLM\n            endpoint to become ready, in minutes.\n     \
          \   enable_progression_tracking: Enable progress reporting.\n        metrics_port:\
          \ HTTP port for extraction metrics; valid range is ``1024``-``65535``.\n\
          \        metrics_poll_interval_seconds: Seconds between metrics polls; valid\
          \ range is ``5``-``300``.\n        packages_to_install: Comma-separated\
          \ packages for the Trainer job.\n        pip_index_urls: Comma-separated\
          \ package indexes for the Trainer job.\n        training_envs: Comma-separated\
          \ environment overrides for the Trainer job.\n        training_runtime:\
          \ ClusterTrainingRuntime used for extraction.\n        persistent_pvc: Name\
          \ of the shared PVC mounted at ``persistent_mount_path``.\n        persistent_mount_path:\
          \ Local mount path corresponding to ``persistent_pvc``.\n        download_model:\
          \ Download the verifier model to the shared PVC before extraction.\n   \
          \     output_hidden_states: Optional KFP artifact for the extracted hidden\
          \ states.\n        kubernetes_config: KFP task Kubernetes configuration\
          \ passed through to Trainer.\n    \"\"\"\n    from pathlib import Path\n\
          \n    def resolve_local_dataset_path(dataset_uri: str) -> str:\n       \
          \ if not dataset_uri:\n            return dataset_uri\n\n        if dataset_uri.startswith(\"\
          pvc://\"):\n            claim, separator, dataset_path = dataset_uri.removeprefix(\"\
          pvc://\").partition(\"/\")\n            if not claim or not separator or\
          \ not dataset_path:\n                raise ValueError(\"PVC dataset URIs\
          \ must use pvc://<claim>/<path>\")\n            requested_path = Path(dataset_path)\n\
          \            if claim != persistent_pvc:\n                if requested_path.is_absolute()\
          \ or \"..\" in requested_path.parts:\n                    raise ValueError(\"\
          PVC dataset paths must remain relative\")\n                if requested_path.suffix.lower()\
          \ not in {\".json\", \".jsonl\"}:\n                    raise ValueError(\"\
          dataset files on the shared PVC must end in .json or .jsonl\")\n       \
          \         return dataset_uri\n        elif \"://\" in dataset_uri:\n   \
          \         return dataset_uri\n\n        else:\n            candidate = Path(dataset_uri)\n\
          \            if candidate.suffix.lower() not in {\".json\", \".jsonl\"}:\n\
          \                return dataset_uri\n            dataset_path = dataset_uri\n\
          \n        if not persistent_pvc:\n            raise ValueError(\"persistent_pvc\
          \ is required for local JSON/JSONL dataset paths\")\n\n        pvc_root\
          \ = Path(persistent_mount_path).resolve()\n        candidate = Path(dataset_path)\n\
          \        candidate = candidate if candidate.is_absolute() else pvc_root\
          \ / candidate\n        resolved = candidate.resolve()\n        try:\n  \
          \          relative_path = resolved.relative_to(pvc_root)\n        except\
          \ ValueError as exc:\n            raise ValueError(\"local dataset paths\
          \ must remain within persistent_mount_path\") from exc\n\n        if not\
          \ relative_path.parts:\n            raise ValueError(\"dataset path must\
          \ be a JSON or JSONL file under persistent_mount_path\")\n        if relative_path.suffix.lower()\
          \ not in {\".json\", \".jsonl\"}:\n            raise ValueError(\"dataset\
          \ files on the shared PVC must end in .json or .jsonl\")\n        if not\
          \ resolved.is_file():\n            raise FileNotFoundError(f\"dataset file\
          \ not found on persistent_pvc: {resolved}\")\n\n        return f\"pvc://{persistent_pvc}/{relative_path.as_posix()}\"\
          \n\n    vllm_source = vllm_source.strip().lower()\n    if vllm_source not\
          \ in {\"managed\", \"remote\"}:\n        raise ValueError(\"vllm_source\
          \ must be either 'managed' or 'remote'\")\n    vllm_endpoint = (vllm_endpoint\
          \ or \"\").strip() or None\n    if vllm_source == \"remote\" and vllm_endpoint\
          \ is None:\n        raise ValueError(\"vllm_endpoint is required when vllm_source='remote'\"\
          )\n    if vllm_source == \"managed\" and vllm_endpoint is not None:\n  \
          \      raise ValueError(\"vllm_endpoint must be omitted when vllm_source='managed'\"\
          )\n\n    if vllm_source == \"remote\":\n        verifier_model = verifier_model_pvc\
          \ or verifier_model\n    elif verifier_model_pvc and not download_model:\n\
          \        verifier_model = verifier_model_pvc\n    if dataset_download_enabled:\n\
          \        if not downloaded_dataset_uri:\n            raise ValueError(\"\
          downloaded_dataset_uri is required when dataset download is enabled\")\n\
          \        dataset_name = downloaded_dataset_uri\n    else:\n        dataset_name\
          \ = resolve_local_dataset_path(dataset_name)\n\n    from speculator import\
          \ run_speculator\n\n    return run_speculator(\"data_only\", locals())\n\
          \n"
        image: quay.io/opendatahub/odh-th-torch-cuda-py312:odh-3.6-ea.1@sha256:9ad2d72ebe892dffd3554eeb81e2a47c9fcf0d97f89ed261d48f4e8bbc367b4b
pipelineInfo:
  description: Extract Speculator hidden states using managed or remote vLLM.
  name: speculator-data-only-pipeline
root:
  dag:
    tasks:
      condition-branches-1:
        componentRef:
          name: comp-condition-branches-1
        dependentTasks:
        - download-model
        inputs:
          parameters:
            pipelinechannel--data_extraction_concurrency:
              componentInputParameter: data_extraction_concurrency
            pipelinechannel--data_extraction_max_samples:
              componentInputParameter: data_extraction_max_samples
            pipelinechannel--data_extraction_regenerate_responses:
              componentInputParameter: data_extraction_regenerate_responses
            pipelinechannel--dataset_name:
              componentInputParameter: dataset_name
            pipelinechannel--download_model:
              componentInputParameter: download_model
            pipelinechannel--enable_progression_tracking:
              componentInputParameter: enable_progression_tracking
            pipelinechannel--hidden_states_path:
              componentInputParameter: hidden_states_path
            pipelinechannel--metrics_poll_interval_seconds:
              componentInputParameter: metrics_poll_interval_seconds
            pipelinechannel--metrics_port:
              componentInputParameter: metrics_port
            pipelinechannel--output_dir:
              componentInputParameter: output_dir
            pipelinechannel--packages_to_install:
              componentInputParameter: packages_to_install
            pipelinechannel--persistent_pvc:
              componentInputParameter: persistent_pvc
            pipelinechannel--pip_index_urls:
              componentInputParameter: pip_index_urls
            pipelinechannel--speculator_type:
              componentInputParameter: speculator_type
            pipelinechannel--target_layer_ids:
              componentInputParameter: target_layer_ids
            pipelinechannel--total_seq_len:
              componentInputParameter: total_seq_len
            pipelinechannel--training_envs:
              componentInputParameter: training_envs
            pipelinechannel--training_runtime:
              componentInputParameter: training_runtime
            pipelinechannel--verifier_model:
              componentInputParameter: verifier_model
            pipelinechannel--verifier_model_pvc:
              componentInputParameter: verifier_model_pvc
            pipelinechannel--vllm_endpoint:
              componentInputParameter: vllm_endpoint
            pipelinechannel--vllm_gpu_memory_utilization:
              componentInputParameter: vllm_gpu_memory_utilization
            pipelinechannel--vllm_readiness_timeout_minutes:
              componentInputParameter: vllm_readiness_timeout_minutes
            pipelinechannel--vllm_resource_gpu:
              componentInputParameter: vllm_resource_gpu
            pipelinechannel--vllm_resource_memory:
              componentInputParameter: vllm_resource_memory
            pipelinechannel--vllm_source:
              componentInputParameter: vllm_source
        taskInfo:
          name: condition-branches-1
      download-model:
        cachingOptions: {}
        componentRef:
          name: comp-download-model
        inputs:
          parameters:
            download_enabled:
              componentInputParameter: download_model
            model_cache_mount:
              runtimeValue:
                constant: /mnt/persistent/models
            model_cache_pvc:
              componentInputParameter: persistent_pvc
            model_name:
              componentInputParameter: verifier_model
        taskInfo:
          name: download-model
  inputDefinitions:
    parameters:
      data_extraction_concurrency:
        defaultValue: 1.0
        description: 'Number of concurrent vLLM requests for

          hidden-state extraction; use ``1`` on shared or NFS storage.'
        isOptional: true
        parameterType: NUMBER_INTEGER
      data_extraction_max_samples:
        defaultValue: 16.0
        description: Maximum samples to process; ``0`` processes the full dataset.
        isOptional: true
        parameterType: NUMBER_INTEGER
      data_extraction_regenerate_responses:
        defaultValue: false
        description: 'Regenerate responses with the verifier;

          supported only for ``magpie``, ``ultrachat``, and ``gsm8k``.'
        isOptional: true
        parameterType: BOOLEAN
      dataset_name:
        defaultValue: ultrachat
        description: 'Use ``magpie`` (Magpie-Align/Magpie-Llama-3.1-Pro-300K-Filtered),

          ``ultrachat`` (HuggingFaceH4/ultrachat_200k; default), or ``gsm8k``

          (openai/gsm8k). For custom data, use an existing JSON/JSONL file on the

          PVC (relative path or ``pvc://<claim>/<path>``); arbitrary Hugging Face

          dataset IDs are not supported.'
        isOptional: true
        parameterType: STRING
      download_model:
        defaultValue: false
        description: 'Download ``verifier_model`` to the PVC. Remote mode uses

          ``verifier_model_pvc``, which must point to the downloaded or cached model.'
        isOptional: true
        parameterType: BOOLEAN
      enable_progression_tracking:
        defaultValue: true
        description: Enable Speculator extraction progress reporting.
        isOptional: true
        parameterType: BOOLEAN
      hidden_states_path:
        defaultValue: speculator-output/hidden_states
        description: 'Remote-mode hidden-state output on the PVC shared with

          vLLM; managed mode writes to ``<output_dir>/hidden_states``.'
        isOptional: true
        parameterType: STRING
      metrics_poll_interval_seconds:
        defaultValue: 30.0
        description: Seconds between metrics polls; valid range is ``5``-``300``.
        isOptional: true
        parameterType: NUMBER_INTEGER
      metrics_port:
        defaultValue: 28080.0
        description: HTTP port for extraction metrics; valid range is ``1024``-``65535``.
        isOptional: true
        parameterType: NUMBER_INTEGER
      output_dir:
        defaultValue: speculator-output
        description: 'Trainer output directory on the PVC. ``speculator-output`` is
          the

          default; choose another relative path or a URI for that PVC.'
        isOptional: true
        parameterType: STRING
      packages_to_install:
        defaultValue: ''
        description: Comma-separated Python packages to install in the Trainer job.
        isOptional: true
        parameterType: STRING
      persistent_pvc:
        description: 'Existing PVC mounted at ``/mnt/persistent`` for the verifier,

          local datasets, and outputs.'
        parameterType: STRING
      pip_index_urls:
        defaultValue: ''
        description: Comma-separated package-index URLs used for Trainer job installs.
        isOptional: true
        parameterType: STRING
      speculator_type:
        defaultValue: eagle3
        description: Draft architecture; ``eagle3`` is currently the only supported
          type.
        isOptional: true
        parameterType: STRING
      target_layer_ids:
        defaultValue: ''
        description: 'Exactly four comma-separated verifier layer indices; required

          for the default PVC-backed verifier and remote vLLM. The SDK can infer them

          only from a Hugging Face model ID passed directly.'
        isOptional: true
        parameterType: STRING
      total_seq_len:
        defaultValue: 2048.0
        description: Maximum sequence length for dataset preprocessing and vLLM extraction;
          must be positive.
        isOptional: true
        parameterType: NUMBER_INTEGER
      training_envs:
        defaultValue: NCCL_DEBUG=INFO,PYTHONUNBUFFERED=1
        description: Comma-separated ``KEY=VALUE`` environment overrides for the Trainer
          job.
        isOptional: true
        parameterType: STRING
      training_runtime:
        defaultValue: vllm-extract-cuda
        description: Name of the ClusterTrainingRuntime used by the Trainer job.
        isOptional: true
        parameterType: STRING
      verifier_model:
        defaultValue: ''
        description: 'Hugging Face Hub model ID to download when ``download_model``
          is

          true; leave empty when reusing ``verifier_model_pvc``.'
        isOptional: true
        parameterType: STRING
      verifier_model_pvc:
        defaultValue: models/Qwen--Qwen2.5-1.5B-Instruct
        description: 'Path to the cached or downloaded verifier on the PVC; use

          a relative path or a ``pvc://`` URI.'
        isOptional: true
        parameterType: STRING
      vllm_endpoint:
        defaultValue: ''
        description: URL of the external vLLM service; required for ``remote`` and
          blank for ``managed``.
        isOptional: true
        parameterType: STRING
      vllm_gpu_memory_utilization:
        defaultValue: 0.9
        description: Fraction of GPU memory available to vLLM, in the range ``(0,
          1]``.
        isOptional: true
        parameterType: NUMBER_DOUBLE
      vllm_readiness_timeout_minutes:
        defaultValue: 60.0
        description: 'Maximum wait for the managed or remote vLLM

          endpoint to become ready, in minutes; minimum ``1``.'
        isOptional: true
        parameterType: NUMBER_INTEGER
      vllm_resource_gpu:
        defaultValue: 1.0
        description: GPUs requested by managed vLLM; the SDK currently supports exactly
          ``1``.
        isOptional: true
        parameterType: NUMBER_INTEGER
      vllm_resource_memory:
        defaultValue: 96Gi
        description: Memory requested by the managed vLLM sidecar.
        isOptional: true
        parameterType: STRING
      vllm_source:
        defaultValue: managed
        description: Use ``managed`` for a vLLM sidecar in the Trainer job or ``remote``
          for an external vLLM service.
        isOptional: true
        parameterType: STRING
