              hidden_states_path:
                componentInputParameter: pipelinechannel--hidden_states_path
              metrics_poll_interval_seconds:
                componentInputParameter: pipelinechannel--metrics_poll_interval_seconds
              metrics_port:
                componentInputParameter: pipelinechannel--metrics_port
              output_dir:
                componentInputParameter: pipelinechannel--output_dir
              packages_to_install:
                componentInputParameter: pipelinechannel--packages_to_install
              persistent_mount_path:
                runtimeValue:
                  constant: /mnt/persistent
              persistent_pvc:
                componentInputParameter: pipelinechannel--persistent_pvc
              pip_index_urls:
                componentInputParameter: pipelinechannel--pip_index_urls
              pvc_path:
                runtimeValue:
                  constant: '{{$.workspace_path}}'
              speculator_type:
                componentInputParameter: pipelinechannel--speculator_type
              target_layer_ids:
                componentInputParameter: pipelinechannel--target_layer_ids
              total_seq_len:
                componentInputParameter: pipelinechannel--total_seq_len
              training_envs:
                componentInputParameter: pipelinechannel--training_envs
              training_runtime:
                componentInputParameter: pipelinechannel--training_runtime
              verifier_model:
                componentInputParameter: pipelinechannel--verifier_model
              verifier_model_pvc:
                componentInputParameter: pipelinechannel--verifier_model_pvc
              vllm_gpu_memory_utilization:
                componentInputParameter: pipelinechannel--vllm_gpu_memory_utilization
              vllm_readiness_timeout_minutes:
